name: release-please

# Keeps a release pull request open for the TV app: it bumps the version in apps/tv
# (package.json and the webOS appinfo.json) and writes the changelog from the commit
# messages (fix: -> patch, feat: -> minor). Merging that pull request tags the release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
